// Generated by syncron/run.py -- SynCron (HPCA'21) Table 5, HBM variant.
sys = {
    lineSize = 64;
    frequency = 2000;

    // Table 5: buffered crossbar per NDP unit, 1-cycle arbitration + 1 cycle/hop, M/D/1 queuing.
    networkType = "mesh";
    networkFile = "syncron/network_4x16.mesh";


    cores = {
        unit0 = {
            type = "Timing";
            cores = 16;
            icache = "l1i_u0";
            dcache = "l1d_u0";
            pim = true;
        };
        unit1 = {
            type = "Timing";
            cores = 16;
            icache = "l1i_u1";
            dcache = "l1d_u1";
            pim = true;
        };
        unit2 = {
            type = "Timing";
            cores = 16;
            icache = "l1i_u2";
            dcache = "l1d_u2";
            pim = true;
        };
        unit3 = {
            type = "Timing";
            cores = 16;
            icache = "l1i_u3";
            dcache = "l1d_u3";
            pim = true;
        };
    };

    caches = {
        l1i_u0 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1d_u0 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1i_u1 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1d_u1 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1i_u2 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1d_u2 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1i_u3 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };
        l1d_u3 = { caches = 16; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 2; }; };

        // No shared cache and no coherence in an NDP unit (Table 5). The LLC exists only because zsim needs exactly
        // one parentless cache group; `bypass` makes it forward every access to memory with no latency and no data,
        // as DAMOV's own PIM template does. One bank per unit, so the crossbar has a per-unit endpoint.
        llc = {
            caches = 1;
            banks = 4;
            size = 4194304;
            latency = 0;
            array = { type = "SetAssoc"; hash = "H3"; ways = 16; };
            bypass = true;
            children = "l1i_u0|l1d_u0 l1i_u1|l1d_u1 l1i_u2|l1d_u2 l1i_u3|l1d_u3";
        };
    };


    syncron = {
        units = 4;
        coresPerUnit = 16;
        stEntries = 64;              // Table 5
        indexingCounters = 256;      // Table 5
        spuMHz = 1000;               // Table 5
        serviceCycles = 12;          // Table 5: SPU cycles per message
        localMsgCycles = 2;    // core <-> local SE, one way
        globalMsgCycles = 80;  // local SE <-> Master SE, one way (40 ns)
        bytesPerUnit = 1073741824L;
    };

    mem = {
        type = "Ramulator2";
        clockMode = "ns";
        ramulatorConfig = "ramulator2-configs/HBM1-1Gb-4stack.yaml";
        latency = 1;
    };
};

sim = {
    pimMode = false;          // per-core: sys.cores.<group>.pim
    stats = "zsim_stats/syncron/barrier_units__u4x16__t64__p100__f2000__timing";
    phaseLength = 100;

    statsPhaseInterval = 100000;
    printHierarchy = true;
    gmMBytes = 8192;
    pinOptions = "-ifeellucky";
    deadlockDetection = false;
};

process0 = {
    command = "../workloads/syncron/barrier --participants 64 --rounds 20 --scope units --units 4 --cores-per-unit 16 --stack-mb 1024";
    startFastForwarded = True;
};
