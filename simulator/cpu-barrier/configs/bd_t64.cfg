// Generated by cpu-barrier/run.py -- CPU baseline: 1 processor(s) x 64 Westmere-class cores, hybrid MPI.
sys = {
    lineSize = 64;
    frequency = 2000;

    cores = {
        core = {
            type = "OOO";
            cores = 64;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    caches = {
        l1i = { caches = 64; size = 16384; latency = 3; array = { type = "SetAssoc"; ways = 4; }; };
        l1d = { caches = 64; size = 16384; latency = 4; array = { type = "SetAssoc"; ways = 8; }; };
        l2 = {
            caches = 64;
            size = 262144;
            latency = 7;
            array = { type = "SetAssoc"; ways = 8; };
            children = "l1i|l1d";
        };
        // One 4 MB L3 per processor: cache p serves the L2s of cores 64p .. 64p+63.
        l3 = {
            type = "Timing";
            caches = 1;
            banks = 16;
            size = 4194304;
            latency = 27;
            // Blocking directory (coherence_ctrls.h): a line moves between cores one transfer at a time, each paying
            // its full latency -- zsim otherwise lets N contending cores each take the line at once.
            serializeTransfers = true;
            array = { type = "SetAssoc"; hash = "H3"; ways = 16; };
            children = "l2";
        };
    };

    mem = {
        type = "Ramulator2";
        clockMode = "ns";
        ramulatorConfig = "ramulator2-configs/HBM3E-24Gb_12hi.yaml";
        latency = 1;
    };
};

sim = {
    pimMode = false;
    stats = "zsim_stats/cpu-barrier/bd_t64";
    phaseLength = 100;
    statsPhaseInterval = 100000;
    printHierarchy = false;
    gmMBytes = 16384;
    pinOptions = "-ifeellucky";
    deadlockDetection = false;
};

process0 = {
    command = "../workloads/cpu-barrier/cpu_barrier_bd --threads 64 --cores-per-proc 64 --rounds 20 --warmup 50";
    startFastForwarded = True;
};
