// Generated by barrier/run.py -- host-mediated barrier across HBM-PIM units.
sys = {
    lineSize = 64;
    frequency = 2000;

    cores = {
        host = {                 // core 0: the mediator, normal cache hierarchy, host PHY path
            type = "Timing";
            cores = 1;
            icache = "l1i_host";
            dcache = "l1d_host";
            pim = false;
        };
        pim = {                  // cores 1..N: one PIM unit per HBM3E channel
            type = "Timing";
            cores = 64;
            icache = "l1i_pim";
            dcache = "l1d_pim";
            pim = true;
        };
    };

    caches = {
        l1d_host = { caches = 1; size = 32768; latency = 4; array = { type = "SetAssoc"; ways = 8; }; };
        l1i_host = { caches = 1; size = 32768; latency = 3; array = { type = "SetAssoc"; ways = 4; }; };
        l2_host  = { caches = 1; size = 262144; latency = 7; array = { type = "SetAssoc"; ways = 8; };
                     children = "l1i_host|l1d_host"; };

        l1d_pim = { caches = 64; size = 32768; latency = 4; array = { type = "SetAssoc"; ways = 8; }; };
        l1i_pim = { caches = 64; size = 32768; latency = 3; array = { type = "SetAssoc"; ways = 4; }; };

        l3 = {                   // bypassed (DAMOV's PIM model): no LLC data, and no coherence host <-> PIM
            caches = 1;
            banks = 4;
            size = 8388608;
            latency = 27;
            array = { type = "SetAssoc"; hash = "H3"; ways = 16; };
            bypass = true;
            children = "l2_host l1i_pim|l1d_pim";
        };
    };

    mem = {
        type = "Ramulator2";
        clockMode = "ns";
        ramulatorConfig = "ramulator2-configs/HBM3E-24Gb_12hi-4stack.yaml";
        latency = 1;
    };
};

sim = {
    pimMode = false;          // per-core: sys.cores.<group>.pim
    stats = "zsim_stats/barrier/inord_d4";
    phaseLength = 100;
    domains = 4;
    statsPhaseInterval = 10000;
    printHierarchy = true;
    gmMBytes = 8192;
    pinOptions = "-ifeellucky";
    deadlockDetection = false;
};

process0 = {
    command = "../workloads/sync-primitives/barrier_host --participants 64 --rounds 50 --warmup 2 --channels 64 --chan-stride 1024 --mhz 2000 --map cpu --csv zsim_stats/barrier/hbm3e__n64__p100__f2000__s4.barriers.csv";
    startFastForwarded = True;
};
